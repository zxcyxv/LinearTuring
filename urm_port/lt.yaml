ckpt: False
boundary_mlp: True   # [2026-08-26] 기본값 True 로 변경 — False 기본이 5일차 오전 6개 런을 무효로 만들었다 (경계=w_bo contract 로 폴백). 선형 경계 절제(lin_boundaries) 시 명시적으로 False 필요
mlp_expansion: 4.0
